[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cloudcr-oracle-backup"
version = "0.1.0"
description = "Herramienta para la Gestión de Estrategias de Respaldo de Bases de Datos Oracle con RMAN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "oracledb>=2.4",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
cloudcr = "cloudcr_backup.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudcr_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["oracle: requiere una instancia Oracle local accesible con autenticación del sistema operativo"]
addopts = "-m 'not oracle'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["cloudcr_backup"]
